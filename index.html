<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B1622" />

    <!-- The page opens in snowy night. A saved "snow day" choice is applied before first paint, so it never flashes the wrong theme. -->
    <script>
      try {
        if (localStorage.getItem("theme-choice") === "day") {
          delete document.documentElement.dataset.theme;
          document.querySelector('meta[name="theme-color"]').content = "#F6FAFC";
        }
      } catch (e) {}
      // The opening screen shows on every load, except for reduced motion.
      try {
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("no-boot");
      } catch (e) {}
      // Every load starts at the top. A refresh also drops a section link left in the address by the menu;
      // a link opened fresh from elsewhere (…/#work) is still honoured once the page is up.
      try {
        history.scrollRestoration = "manual";
        var nav = performance.getEntriesByType("navigation")[0];
        if (nav && nav.type === "reload" && location.hash) history.replaceState(null, "", location.pathname + location.search);
      } catch (e) {}
    </script>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: #0b1622;
      }
      html.no-boot #boot {
        display: none;
      }
    </style>
